# Render blueprint for the Digital Heritage Archive.
#
# Three resources: a PostgreSQL database, a web service that serves both the
# interface and the API from one port, and a worker that drains the job queue.
#
# The single-port arrangement is the whole reason Dockerfile.render exists.
# Render gives a service one listening port, so there is nowhere to put nginx in
# front. FastAPI serves the built interface instead, which means one origin, no
# CORS to configure, and no second process to supervise. The trade is that
# static files now pass through Python; for an archive of text that is not worth
# optimising. The kiosk arrangement in Dockerfile still uses nginx, where there
# is a machine to put it on.
#
# Deploy with: New > Blueprint > point at this repository.
# The database password and the signing secret are generated by Render. Neither
# is in this file, and neither should ever be.

datastore:
  - name: archive-db
    plan: basic-256mb
    # 16 so the pgvector image and the local schema stay on one major version.
    postgresMajorVersion: "16"

services:
  # ------------------------------------------------------------------- web --
  - type: web
    name: archive
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    # The container refuses to start until its schema matches the code, so the
    # health check is only reached by a service that is genuinely able to serve.
    healthCheckPath: /api/v1/health
    # A free instance sleeps after inactivity and its database is destroyed
    # after 30 days. Both are fine for a demonstration and wrong for an archive.
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: archive-db
          property: connectionString
      # Anyone who can read this repository can read this key, so it must not be
      # in this file. The archive refuses to start on the shipped default, which
      # means forgetting this fails loudly instead of quietly.
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      # nginx is not in this deployment, so FastAPI serves the built interface
      # and both live on one origin. CORS is therefore not needed at all.
      - key: CORS_ORIGINS
        value: "[]"
      # Set this to the deployed address so citation links and the offline page
      # point at the service a reader can actually visit.
      - key: PUBLIC_BASE_URL
        sync: false
      # No Redis on this plan. The database queue is slower and completely
      # adequate at this volume, and it is one fewer thing to pay for.
      - key: QUEUE_BACKEND
        value: database
      - key: STORAGE_BACKEND
        value: filesystem
      # Uploads and OCR output are lost on redeploy. A disk or an object store is
      # the fix; see docs/RENDER.md.
      - key: LOCAL_STORAGE_PATH
        value: /var/lib/dha/objects
      # Deliberately no model providers. With none set the archive answers with
      # extractive summaries and hashed embeddings, and says so in its health
      # response. It is better to be honest about that than to fail at query
      # time, and it keeps the deployment free of third-party credentials.
      - key: LLM_PROVIDER
        value: none
      - key: RERANKER_PROVIDER
        value: lexical
      - key: OCR_PROVIDER
        value: tesseract

  # ---------------------------------------------------------------- worker --
  - type: worker
    name: archive-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    # Background workers are a paid feature on Render. Removing this block leaves
    # the site working: the corpus is embedded and searchable, and only the
    # deferred work — backfills, OCR, graph extraction, refreshes — stops
    # running. Nothing a first-time visitor does depends on it.
    dockerCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: archive-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: QUEUE_BACKEND
        value: database
      - key: STORAGE_BACKEND
        value: filesystem
      - key: LOCAL_STORAGE_PATH
        value: /var/lib/dha/objects
      - key: LLM_PROVIDER
        value: none
      - key: RERANKER_PROVIDER
        value: lexical
      - key: OCR_PROVIDER
        value: tesseract
