# Render blueprint for the Digital Heritage Archive, on free tiers.
#
# Two resources: a PostgreSQL database and a web service that serves both the
# interface and the API from one port. That is the whole deployment, and it
# costs nothing to run.
#
# Deploy with: New > Blueprint > point at this repository.
# The database password and the signing secret are generated by Render. Neither
# is in this file, and neither should ever be.
#
# --------------------------------------------------------------------------
# What "free" costs you here, stated up front rather than in a footnote.
#
# Render's free web service sleeps after 15 minutes of inactivity, so the first
# visitor after a quiet spell waits for a cold start. The free database is
# destroyed 30 days after it is created. This is a demonstration arrangement,
# not an archive: a corpus that vanishes a month later is not a corpus. If this
# is going to hold anything of value, it needs a paid database, and that is one
# setting in this file rather than a rewrite.
#
# There is no background worker, because free Render does not offer one. The
# consequence is handled rather than ignored: QUEUE_BACKEND=inline runs each job
# inside the API process as it is enqueued, so uploads, OCR and graph extraction
# still complete. The cost is that the work happens inside a user-facing request,
# and a process killed mid-job leaves that job stuck. /api/v1/health reports
# backend "inline" and says why the worker count is zero, so the state is
# visible rather than inferred.

databases:
  - name: archive-db
    plan: free
    # 16 so the pgvector image and the local schema stay on one major version.
    postgresMajorVersion: "16"

services:
  # ------------------------------------------------------------------- web --
  - type: web
    name: archive
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    # The container refuses to start until its schema matches the code, so the
    # health check is only reached by a service that is genuinely able to serve.
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: archive-db
          property: connectionString
      # Anyone who can read this repository can read this key, so it must not be
      # in this file. The archive refuses to start on the shipped default, which
      # means forgetting this fails loudly instead of quietly.
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      # nginx is not in this deployment, so FastAPI serves the built interface
      # and both live on one origin. CORS is therefore not needed at all.
      - key: CORS_ORIGINS
        value: "[]"
      # Set this to the deployed address so citation links and the offline page
      # point at the service a reader can actually visit.
      - key: PUBLIC_BASE_URL
        sync: false
      # No worker and no Redis, so jobs run in-process. See the note at the top.
      - key: QUEUE_BACKEND
        value: inline
      - key: STORAGE_BACKEND
        value: filesystem
      # Uploads and OCR output are lost on redeploy, and on every wake from
      # sleep. A disk or an object store is the fix; see docs/RENDER.md.
      - key: LOCAL_STORAGE_PATH
        value: /var/lib/dha/objects
      # The default is 512 MB, which is the entire memory of a free web service.
      # A PDF that size would be read into memory and handed to tesseract, and
      # the service would be killed mid-request by the out-of-memory killer. 32 MB
      # is still a long document and leaves room to do something with it.
      - key: MAX_UPLOAD_BYTES
        value: "33554432"
      # Deliberately no model providers. With none set the archive answers with
      # extractive summaries and hashed embeddings, and says so in its health
      # response. It is better to be honest about that than to fail at query
      # time, and it keeps the deployment free of third-party credentials.
      - key: LLM_PROVIDER
        value: extractive
      - key: RERANKER_PROVIDER
        value: lexical
      - key: OCR_PROVIDER
        value: tesseract
