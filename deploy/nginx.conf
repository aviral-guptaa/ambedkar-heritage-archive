# The kiosk's web tier: static interface plus a proxy to the archive.
#
# One port, so a venue does not have to configure CORS, and so the service
# worker's scope covers the API it caches.

upstream archive_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A kiosk is a fixed screen; a mis-sized request should not be served.
    client_max_body_size 32m;

    # --- the archive's own responses -----------------------------------------
    location /api/ {
        proxy_pass http://archive_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Long enough for a reranking request on a slow single-board computer.
        proxy_read_timeout 120s;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- the interface ------------------------------------------------------
    # Hashed assets are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker decides what is available offline. If the browser held
    # on to an old one, a withdrawn record could be served indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The shell is never cached, for the same reason.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page routing: any other path is the shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
